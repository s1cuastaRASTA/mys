<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { margin: 0; padding: 0; }
html, body { height: 100%; background: #121212; }
#map { height: 100%; width: 100%; }
.leaflet-control-zoom a {
    background: #1e1e1e !important; color: #e0e0e0 !important;
    border-color: #333 !important; font-size: 18px !important;
}
.leaflet-control-attribution { display: none; }
.route-glow {
    filter: drop-shadow(0 0 6px rgba(0,170,255,0.5));
}
</style>
</head>
<body>
<div id="map"></div>

<script>
var lat = 44.4268, lng = 26.1025;
var followMode = true;

var map = L.map('map', {
    center: [lat, lng],
    zoom: 16,
    zoomControl: true,
    attributionControl: false,
    zoomSnap: 0.5
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 19
}).addTo(map);

// Current position marker
var posMarker = L.circleMarker([lat, lng], {
    radius: 9,
    fillColor: '#FFD600',
    color: '#000',
    weight: 2,
    opacity: 1,
    fillOpacity: 0.95
}).addTo(map);

// Accuracy circle
var accCircle = L.circle([lat, lng], {
    radius: 20,
    color: '#FFD600',
    fillColor: '#FFD600',
    fillOpacity: 0.08,
    weight: 1,
    opacity: 0.15
}).addTo(map);

// Destination marker
var destMarker = null;
var destName = '';

// Route polyline
var routeLine = null;
var routeCoords = [];
var routeProgress = null;

// Next turn marker
var turnMarker = null;

// Direction arrow for position
var headingArrow = null;

function updatePosition(newLat, newLng) {
    lat = newLat; lng = newLng;
    posMarker.setLatLng([lat, lng]);
    accCircle.setLatLng([lat, lng]);

    if (routeCoords.length > 0) {
        updateRouteProgress();
    }

    if (followMode && routeCoords.length === 0) {
        map.panTo([lat, lng], { animate: false });
    }
}

function updateAccuracy(meters) {
    if (meters > 0) accCircle.setRadius(meters);
}

function updateHeading(deg) {
    // Could rotate a heading indicator
}

function setRoute(coordsJson, dlat, dlon, name) {
    routeCoords = JSON.parse(coordsJson);
    destName = name;

    // Clear previous
    if (routeLine) map.removeLayer(routeLine);
    if (routeProgress) map.removeLayer(routeProgress);
    if (destMarker) map.removeLayer(destMarker);
    if (turnMarker) map.removeLayer(turnMarker);

    // Draw route
    routeLine = L.polyline(routeCoords, {
        color: '#00AAFF',
        weight: 6,
        opacity: 0.7,
        className: 'route-glow'
    }).addTo(map);

    // Route outline (darker)
    L.polyline(routeCoords, {
        color: '#005588',
        weight: 12,
        opacity: 0.25
    }).addTo(map);

    // Progress line (will be drawn on updates)
    routeProgress = L.polyline([], {
        color: '#00E5FF',
        weight: 5,
        opacity: 0.9
    }).addTo(map);

    // Destination marker
    destMarker = L.circleMarker([dlat, dlon], {
        radius: 10,
        fillColor: '#00E676',
        color: '#FFF',
        weight: 2,
        opacity: 1,
        fillOpacity: 0.9
    }).addTo(map).bindTooltip(name || 'Destinație', {
        direction: 'top', offset: [0, -12]
    }).openTooltip();

    // Fit map to show entire route
    map.fitBounds(routeLine.getBounds(), { padding: [60, 60] });
    followMode = true;

    // Initial progress update
    updateRouteProgress();
}

function showDestination(dlat, dlon, name) {
    if (destMarker) map.removeLayer(destMarker);
    if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
    if (routeProgress) { map.removeLayer(routeProgress); routeProgress = null; }
    destMarker = L.circleMarker([dlat, dlon], {
        radius: 10,
        fillColor: '#00E676',
        color: '#FFF',
        weight: 2,
        opacity: 1,
        fillOpacity: 0.9
    }).addTo(map).bindTooltip(name, { direction: 'top', offset: [0, -12] }).openTooltip();

    // Draw dashed straight line
    routeLine = L.polyline([[lat, lng], [dlat, dlon]], {
        color: '#00E676',
        weight: 3,
        opacity: 0.5,
        dashArray: '10, 10'
    }).addTo(map);

    routeCoords = [[lat, lng], [dlat, dlon]];
    map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
}

function showTurnPoint(dlat, dlon) {
    if (turnMarker) map.removeLayer(turnMarker);
    turnMarker = L.circleMarker([dlat, dlon], {
        radius: 7,
        fillColor: '#FF9100',
        color: '#FFF',
        weight: 2,
        opacity: 1,
        fillOpacity: 0.95
    }).addTo(map);

    if (followMode) {
        map.panTo([dlat, dlon], { animate: true, duration: 0.8 });
    }
}

function updateRouteProgress() {
    if (routeCoords.length === 0) return;

    // Find nearest point on route
    var minDist = Infinity;
    var nearestIdx = 0;
    for (var i = 0; i < routeCoords.length; i++) {
        var d = dist(lat, lng, routeCoords[i][0], routeCoords[i][1]);
        if (d < minDist) { minDist = d; nearestIdx = i; }
    }

    // Draw progress from start to nearest point
    var progress = routeCoords.slice(0, nearestIdx + 1);
    progress.push([lat, lng]);
    routeProgress.setLatLngs(progress);

    if (followMode) {
        // Pan map to keep position and next part of route visible
        var lookAhead = Math.min(nearestIdx + 15, routeCoords.length - 1);
        var bounds = L.latLngBounds([
            [lat, lng],
            routeCoords[lookAhead]
        ]);
        if (destMarker) bounds.extend(destMarker.getLatLng());
        map.fitBounds(bounds, { padding: [40, 40], animate: true, duration: 0.8, maxZoom: 16 });
    }
}

function clearRoute() {
    routeCoords = [];
    if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
    if (routeProgress) { map.removeLayer(routeProgress); routeProgress = null; }
    if (destMarker) { map.removeLayer(destMarker); destMarker = null; }
    if (turnMarker) { map.removeLayer(turnMarker); turnMarker = null; }
    // Remove the route outline layers
    map.eachLayer(function(layer) {
        if (layer instanceof L.Polyline && layer !== routeLine && layer !== routeProgress && layer.options.color === '#005588') {
            map.removeLayer(layer);
        }
    });
    map.setView([lat, lng], 16, { animate: true });
}

function centerMap() {
    if (routeCoords.length > 0 && destMarker) {
        map.fitBounds(routeLine.getBounds(), { padding: [40, 40] });
    } else {
        map.setView([lat, lng], 16, { animate: true });
    }
}

function dist(lat1, lon1, lat2, lon2) {
    var R = 6371000;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// Notify Kotlin that map is ready
function onMapReady() {
    if (typeof AndroidBridge !== 'undefined' && AndroidBridge.onMapReady) {
        AndroidBridge.onMapReady();
    }
}

// Try to notify, will retry if bridge not ready
setTimeout(onMapReady, 300);
</script>
</body>
</html>
