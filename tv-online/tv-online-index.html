        .tabs {

        .tab {

            background: var(--tab-bg);
            color: var(--text-muted);

            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s;
            user-select: none;

        .search-bar {

            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            position: relative;
        }
        .search-bar input {

            padding: 9px 16px 9px 38px;
            border-radius: 24px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-bar input:focus { border-color: var(--accent); }
        .search-bar::before {
            content: '\1F50D';
            position: absolute;
            left: 34px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.8rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 12px 16px;
        }
        .category-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);

            padding-left: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .category-title::after {

            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
            gap: 10px;
        }

            border-radius: var(--radius);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;

            background: var(--card-hover);
            transform: translateY(-3px);
            box-shadow: var(--shadow);
            border-color: var(--accent);
        }

        .quality-SD { background: var(--badge-sd); color: #1a1a1a; }

            top: 5px;
            left: 5px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #00e676;
            animation: pulse 1.5s infinite;

            0%, 100% { opacity: 1; }

            bottom: 4px;
            right: 6px;
            font-size: 0.55rem;
            color: var(--text-muted);

            justify-content: center;

// ============================================================
//  LOGICA
// ============================================================
let activeCategory = "Toate";
let searchQuery = "";

function getLogoText(name) {
    const words = name.split(' ');
    if (words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
    return name.substring(0, 2).toUpperCase();
}

function buildTabs() {
    const tc = document.getElementById('tabsContainer');
    const all = Object.values(channelsData).flat();
    const tabs = [{ name: "Toate", count: all.length }];
    for (const [cat, chs] of Object.entries(channelsData)) tabs.push({ name: cat, count: chs.length });
    tc.innerHTML = tabs.map(t =>
        `<div class="tab${t.name===activeCategory?' active':''}" data-cat="${t.name}">${t.name} <span class="count">${t.count}</span></div>`
    ).join('');
    tc.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
        activeCategory = tab.dataset.cat;
        tc.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        renderChannels();
    }));
}

function renderChannels() {
    const container = document.getElementById('channelsContainer');
    let html = '';
    const entries = activeCategory === 'Toate' ? Object.entries(channelsData) : [[activeCategory, channelsData[activeCategory]||[]]];
    for (const [cat, channels] of entries) {
        let filtered = searchQuery ? channels.filter(c => c.name.toLowerCase().includes(searchQuery.toLowerCase())) : channels;
        if (!filtered.length) continue;
        if (activeCategory === 'Toate') html += `<div class="category-title">${cat}</div>`;
        html += '<div class="channels-grid">';
        filtered.forEach((ch, idx) => {
            const logoText = getLogoText(ch.name);
            const sc = ch.servers ? ch.servers.length : 0;
            html += `<div class="channel-card" data-cat="${cat}" data-idx="${idx}" title="${ch.name} - ${ch.program||''}">
                <div class="channel-logo" style="background:${ch.color}">${logoText}${ch.live?'<span class="live-dot"></span>':''}<span class="quality-badge quality-${ch.quality}">${ch.quality}</span></div>
                <div class="channel-name">${ch.name}</div>${ch.program?`<div class="channel-program">${ch.program}</div>`:''}${sc>1?`<span class="server-count">${sc} servere</span>`:''}</div>`;
        });
        html += '</div>';
    }
    if (!html) html = '<div style="text-align:center;padding:50px 20px;color:var(--text-muted);font-size:0.9rem;">Niciun canal gasit.</div>';
    container.innerHTML = html;
    container.querySelectorAll('.channel-card').forEach(card => card.addEventListener('click', () => {
        const ch = channelsData[card.dataset.cat][parseInt(card.dataset.idx)];
        openPlayer(ch);
    }));
}

// ========== MODAL ==========
let currentChannel = null;
let activeServerIndex = 0;

function openPlayer(channel) {
    currentChannel = channel;
    activeServerIndex = 0;
    const overlay = document.getElementById('modalOverlay');
    document.getElementById('modalTitle').textContent = channel.name;
    const logo = document.getElementById('modalLogo');
    logo.textContent = getLogoText(channel.name);
    logo.style.background = channel.color;
    renderServerButtons();
    loadServer(0);
    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';
}

function renderServerButtons() {
    const container = document.getElementById('serverButtons');
    const servers = currentChannel.servers || [];
    if (servers.length <= 1) { container.innerHTML = ''; return; }
    container.innerHTML = servers.map((s, i) =>
        `<button class="server-btn${i===activeServerIndex?' active':''}" data-idx="${i}">${s.label}</button>`
    ).join('');
    container.querySelectorAll('.server-btn').forEach(btn => btn.addEventListener('click', () => {
        activeServerIndex = parseInt(btn.dataset.idx);
        renderServerButtons();
        loadServer(activeServerIndex);
    }));
}

function loadServer(index) {
    const frame = document.getElementById('playerFrame');
    const ph = document.getElementById('playerPlaceholder');
    const servers = currentChannel.servers || [];
    if (!servers.length || !servers[index]) return;

    if (!navigator.onLine) {
        ph.className = 'player-placeholder error';
        ph.innerHTML = '<span class="icon">📡</span><span>Fara semnal — redarea live are nevoie de internet</span>';
        ph.style.display = 'flex';
        frame.style.display = 'none';
        return;
    }

    ph.className = 'player-placeholder';
    ph.innerHTML = '<span class="icon">📺</span><span>Se incarca...</span>';
    ph.style.display = 'flex';
    frame.style.display = 'none';
    frame.src = servers[index].url;

    const loadToken = Symbol();
    frame.dataset.loadToken = loadToken.toString();
    const watchdog = setTimeout(() => {
        ph.className = 'player-placeholder error';
        ph.innerHTML = '<span class="icon">⚠</span><span>Acest server nu raspunde. Incearca alt server sau reincearca.</span><button class="retry-btn" id="retryServerBtn">↻ Reincearca</button>';
        ph.style.display = 'flex';
        const retryBtn = document.getElementById('retryServerBtn');
        if (retryBtn) retryBtn.addEventListener('click', () => loadServer(index));
    }, 8000);

    frame.onload = () => {
        clearTimeout(watchdog);
        ph.style.display = 'none';
        frame.style.display = 'block';
    };
}

function closePlayer() {
    const overlay = document.getElementById('modalOverlay');
    const frame = document.getElementById('playerFrame');
    document.getElementById('serverButtons').innerHTML = '';
    overlay.classList.remove('active');
    document.body.style.overflow = '';
    setTimeout(() => { frame.src = ''; }, 300);
    currentChannel = null;
}

document.getElementById('modalClose').addEventListener('click', closePlayer);
document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target===e.currentTarget) closePlayer(); });
document.addEventListener('keydown', e => { if (e.key==='Escape') closePlayer(); });
document.getElementById('searchInput').addEventListener('input', e => { searchQuery = e.target.value.trim(); renderChannels(); });

// BANNER ONLINE/OFFLINE - util cu semnal slab/intermitent
// ============================================================
const connBanner = document.getElementById('connBanner');
function updateConnBanner() {
    connBanner.classList.toggle('visible', !navigator.onLine);
}
window.addEventListener('online', updateConnBanner);
window.addEventListener('offline', updateConnBanner);
updateConnBanner();

buildTabs();
renderChannels();
</script>
